# Flat node_modules (npm-style, no symlinks). Some hosts' Next.js runtimes copy the standalone
# server output; with pnpm's default symlinked layout that copy fails on Windows (EPERM).
nodeLinker: hoisted

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: false
  "@swc/core": false
  "@parcel/watcher": false
